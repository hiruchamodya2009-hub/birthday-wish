<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Something Special ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #01030c;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   START SCREEN
========================= */

.start-screen {
    position: fixed;
    inset: 0;
    z-index: 999;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

    background:
        radial-gradient(
            circle at center,
            #101b42 0%,
            #050b20 45%,
            #01030c 100%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.start-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.start-button {
    padding: 16px 30px;

    border: 2px solid #e7bd61;
    border-radius: 40px;

    background: rgba(243,223,170,.08);

    color: #f8e9bb;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    letter-spacing: 1.5px;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(231,189,97,.2);

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;

    -webkit-tap-highlight-color: transparent;
}

.start-button:hover {
    transform: scale(1.04);

    background: rgba(243,223,170,.14);

    box-shadow:
        0 0 25px rgba(231,189,97,.35);
}


/* =========================
   SCENE
========================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(53,72,133,.35) 0%,
            rgba(17,29,68,.28) 30%,
            transparent 58%
        ),
        linear-gradient(
            to bottom,
            #01030c 0%,
            #050b20 35%,
            #091332 68%,
            #030713 100%
        );

    animation:
        roomReveal 2.5s ease-out 3.7s forwards;
}


/* Freeze all animations until the user starts */

.scene.waiting * {
    animation-play-state: paused !important;
}


/* =========================
   INTRO
========================= */

.intro {
    position: absolute;
    z-index: 100;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;

    color: #f8e9bb;
    font-size: clamp(17px, 2.3vw, 27px);
    letter-spacing: 4px;

    opacity: 0;

    animation:
        introIn 1.2s ease-out .7s forwards,
        introOut 1.2s ease-in 2.7s forwards;
}


/* =========================
   LIGHT BULB
========================= */

.bulb {
    position: absolute;
    z-index: 20;
    left: 50%;
    top: -130px;

    width: 30px;
    height: 42px;

    transform: translateX(-50%);

    background: #fff1a6;
    border-radius: 50% 50% 45% 45%;

    box-shadow:
        0 0 10px #fff2aa,
        0 0 30px #ffd968,
        0 0 65px rgba(255,207,86,.75);

    opacity: 0;

    animation:
        bulbFall 2.3s cubic-bezier(.2,.85,.3,1) 3.7s forwards,
        bulbGlow 1.5s ease-in-out 6s infinite alternate,
        bulbDisappear 1.5s ease-in 8.5s forwards;
}

.bulb::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;

    width: 17px;
    height: 9px;

    transform: translateX(-50%);

    border-radius: 2px;
    background: #b68b55;
}


/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;
    z-index: 2;

    opacity: 0;

    animation: starsAppear 2s ease-out 3.8s forwards;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;
    background: #fff7d6;

    box-shadow: 0 0 8px rgba(255,247,214,.75);

    animation:
        twinkle
        var(--duration)
        ease-in-out
        var(--delay)
        infinite alternate;
}


/* =========================
   TABLE
========================= */

.table {

    z-index: 5;

    bottom: 0;

    width: 100%;
    height: 18%;

.number-candles {

.number-flame {

    border-radius:

        );

}

.number-one .number-flame {

.number-nine .number-flame {

/* =========================
   SURPRISE BANNER
========================= */

.surprise-banner {

}

.surprise-banner span {
    color: #4a211f;

}


/* =========================
   SURPRISE CONFETTI
========================= */

.surprise-confetti {

}

.surprise-confetti span {
    position: absolute;

    left: 50%;
    top: 21%;

    background: #f3dfaa;

    opacity: 0;

    animation:

        1.2s ease-out
        var(--delay)
        forwards;

    transform:
        translate(-50%, -50%);
}

   WISH
========================= */

.wish-text {

    transform: translateY(-50%);

    text-align: center;

    color: #f8e9bb;

    font-size: clamp(15px,2vw,21px);
    line-height: 1.5;
    letter-spacing: 1px;

    opacity: 0;

    animation:
        wishIn 1.4s ease-out 16.8s forwards,
        wishOut 1.2s ease-in 21.6s forwards;
}


/* =========================
   COUNTDOWN
========================= */

.countdown {

    z-index: 50;

    left: 50%;
    top: 74%;

    width: 100px;
    height: 65px;

    transform: translate(-50%, -50%);

    color: #f8e9bb;

    font-size: 48px;
    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 15px rgba(248,233,187,.55);

    opacity: 1;
}

.countdown span {
    position: absolute;

    left: 0;
    right: 0;

    opacity: 0;
}

.countdown .three {
    animation: count 1s 17.7s forwards;
}

.countdown .two {
    animation: count 1s 18.7s forwards;
}

.countdown .one {
    animation: count 1s 19.7s forwards;
}


/* =========================
   SMOKE
========================= */

.smoke {
    position: absolute;
    z-index: 30;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: rgba(220,220,220,.45);

    filter: blur(2px);

    opacity: 0;
}

.smoke.one {
    left: calc(50% - 35px);
    bottom: 211px;

    animation:
        smokeRise
        2s ease-out
        22.4s forwards;
}

.smoke.two {
    left: calc(50% + 31px);
    bottom: 211px;

    animation:
        smokeRise
        2s ease-out
        22.55s forwards;
}


/* =========================
   FINAL BIRTHDAY MESSAGE
========================= */

.birthday-text {
    position: absolute;
    z-index: 45;

    left: calc(50% + 170px);
    top: 52%;

    width: 255px;

    transform: translateY(-50%);

    text-align: center;

    color: #f8e9bb;

    font-size: clamp(20px, 2.7vw, 32px);
    line-height: 1.4;

    letter-spacing: 2px;

    text-shadow:
        0 0 16px rgba(248,233,187,.4);

    opacity: 0;

    animation:
        birthdayIn
        1.8s ease-out
        22.8s forwards;
}

.birthday-heart {
    display: inline-block;

    margin-left: 7px;

    color: #e84b5f;

    font-size: 1.15em;

    text-shadow:
        0 0 8px rgba(232,75,95,.55),
        0 0 16px rgba(232,75,95,.3);

    transform: translateY(-2px);
}


/* =========================
   FIREWORKS
========================= */

.firework {
    position: absolute;
    z-index: 8;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    opacity: 0;

    animation:
        fireworkShow
        .9s ease-out
        var(--delay)
        forwards;
}

.firework::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 48px;
    height: 48px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,239,180,.95) 0%,
            rgba(255,218,119,.85) 8%,
            rgba(255,190,70,.6) 15%,
            transparent 52%
        );

    box-shadow:
        0 0 12px rgba(255,220,130,.7);

    opacity: 0;

    animation:
        fireworkBurst
        .9s ease-out
        var(--delay)
        forwards;
}


/* =========================
   FINAL CONFETTI
========================= */

.final-confetti {
    position: absolute;
    inset: 0;

    z-index: 35;

    pointer-events: none;
}

.final-confetti span {
    position: absolute;

    top: -20px;

    width: 7px;
    height: 12px;

    border-radius: 2px;

    opacity: 0;

    animation:
        fallConfetti
        2.4s ease-in
        var(--delay)
        forwards;

    transform:
        rotate(var(--rotation));
}


/* =========================
   KEYFRAMES
========================= */

@keyframes introIn {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.95);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes introOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

@keyframes bulbFall {
    0% {
        opacity: 0;
        top: -130px;
    }

    15% {
        opacity: 1;
    }

    75% {
        top: 35%;
    }

    100% {
        opacity: 1;
        top: 38%;
    }
}

@keyframes bulbGlow {
    from {
        filter: brightness(.95);
    }

    to {
        filter: brightness(1.2);
    }
}

@keyframes bulbDisappear {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

@keyframes roomReveal {
    from {
        filter: brightness(.15);
    }

    to {
        filter: brightness(1);
    }
}

@keyframes starsAppear {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes twinkle {
    0% {
        opacity: .25;
        transform: scale(.7);
    }

    45% {
        opacity: .65;
        transform: scale(1);
    }

    100% {
        opacity: 1;
        transform: scale(1.35);
    }
}

@keyframes tableAppear {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@keyframes cakeAppear {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@keyframes flameLight {
    0% {
        opacity: 0;
        transform: translateX(-50%) scale(.1);
    }

    70% {
        opacity: 1;
        transform: translateX(-50%) scale(1.15);
    }

    100% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }
}

@keyframes flameFlicker {
    0% {
        transform:
            translateX(-50%)
            scale(1)
            rotate(-3deg);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1.08,.94)
            rotate(4deg);
    }
}


/* BOTH FLAMES BLOW TO THE LEFT */

@keyframes blowNine {
    0% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    35% {
        opacity: .8;

        transform:
            translateX(-62%)
            translateX(-12px)
            scale(.8,.6)
            rotate(-28deg);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateX(-45px)
            translateY(8px)
            scale(.12,.08)
            rotate(-45deg);
    }
}

@keyframes blowOne {
    0% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    35% {
        opacity: .8;

        transform:
            translateX(-62%)
            translateX(-12px)
            scale(.8,.6)
            rotate(-28deg);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateX(-45px)
            translateY(8px)
            scale(.12,.08)
            rotate(-45deg);
    }
}

@keyframes bannerPop {
    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.55);
    }

    65% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1.08);
    }

    100% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }
}

@keyframes bannerDisappear {
    from {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    to {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.92);
    }
}

@keyframes surprisePiece {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            rotate(0);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r));
    }
}

@keyframes wishIn {
    from {
        opacity: 0;
        transform:
            translateY(-50%)
            translateX(-20px);
    }

    to {
        opacity: 1;
        transform:
            translateY(-50%)
            translateX(0);
    }
}

@keyframes wishOut {
    from {
        opacity: 1;
        transform:
            translateY(-50%)
            translateX(0);
    }

    to {
        opacity: 0;
        transform:
            translateY(-50%)
            translateX(-15px);
    }
}

@keyframes count {
    0% {
        opacity: 0;
        transform: scale(.7);
    }

    25% {
        opacity: 1;
        transform: scale(1.15);
    }

    75% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.25);
    }
}

@keyframes smokeRise {
    0% {
        opacity: .4;
        transform: translateY(0) scale(.7);
    }

    50% {
        opacity: .25;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-60px)
            translateX(-10px)
            scale(2);
    }
}

@keyframes birthdayIn {
    from {
        opacity: 0;
        transform:
            translateY(-50%)
            translateX(25px);
    }

    to {

/* =========================

========================= */

const sounds = {
    bulb: new Audio("bulb.mp3"),
    reveal: new Audio("reveal.mp3"),
    surprise: new Audio("surprise.mp3"),
    candle: new Audio("candle.mp3"),
    blow: new Audio("blow.mp3"),
    applause: new Audio("applause.mp3")
};


/* =========================
   PRELOAD AUDIO
========================= */

Object.values(sounds).forEach(sound => {
    sound.preload = "auto";
    sound.load();
});


/* =========================
   VOLUME
========================= */

sounds.bulb.volume = 0.75;
sounds.reveal.volume = 0.65;
sounds.surprise.volume = 0.8;
sounds.candle.volume = 0.65;
sounds.blow.volume = 0.75;
sounds.applause.volume = 0.65;


/* =========================
   MOBILE AUDIO UNLOCK
========================= */

function unlockSounds() {

    Object.values(sounds).forEach(sound => {

        const originalVolume = sound.volume;

        /* Temporarily silence each sound */
        sound.volume = 0;

        const unlock = sound.play();

        if (unlock !== undefined) {

            unlock.then(() => {

                sound.pause();
                sound.currentTime = 0;
                sound.volume = originalVolume;

            }).catch(() => {

                sound.volume = originalVolume;

            });

        } else {

            sound.pause();
            sound.currentTime = 0;
            sound.volume = originalVolume;

        }

    });

}


/* =========================
   PLAY SOUND
========================= */

function playSound(sound) {

    sound.currentTime = 0;

    const promise = sound.play();

    if (promise !== undefined) {
        promise.catch(() => {
            console.log("Audio could not play:", sound.src);
        });
    }

}


/* =========================
   START
========================= */

const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("startScreen");
const scene = document.getElementById("scene");

let started = false;

startButton.addEventListener("click", () => {

    if (started) return;

    started = true;


    /* =========================
       UNLOCK MOBILE AUDIO
    ========================= */

    unlockSounds();


    /* =========================
       START SCENE
    ========================= */

    scene.classList.remove("waiting");

    startScreen.classList.add("hidden");


    /* =========================
       AUDIO TIMELINE
    ========================= */

    setTimeout(() => {
        playSound(sounds.bulb);
    }, 5950);

    setTimeout(() => {
        playSound(sounds.reveal);
    }, 6150);

    setTimeout(() => {
        playSound(sounds.surprise);
    }, 11000);

    setTimeout(() => {
        playSound(sounds.candle);
    }, 15800);

    setTimeout(() => {
        playSound(sounds.candle);
    }, 16050);

    setTimeout(() => {
        playSound(sounds.blow);
    }, 21800);

    setTimeout(() => {
        playSound(sounds.blow);
    }, 22100);

    setTimeout(() => {
        playSound(sounds.applause);
    }, 22380);

});

</script>
